/* GeoMethode „Graphen lesen“ – Comic-Heft-Design wie „Karten knacken“ und Terra Vergo. Ein helles Thema. */
:root{
  --sky:#B9E2FF; --paper:#FFFFFF; --ink:#1B1B2F; --muted:#4A5266; --line:#D4D9E3;
  --action:#FFD23F; --narr:#FFF3A6;
  --good:#1F9D45; --mid:#E8A600; --bad:#E0393B;
  --s1:#1E6FD0; --s1-t:#DDEBFB;
  --s2:#2FB24C; --s2-t:#DDF6E3;
  --s3:#FF6B3D; --s3-t:#FFE2D7;
  --s4:#C2408F; --s4-t:#F9E3F0;
  --stein:#8B1E2D; --stein-t:#FDE7E3;
  --f-comic:"Bangers","Impact","Arial Black",sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(rgba(27,27,47,.10) 1.3px,transparent 1.6px);background-size:11px 11px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:grid;gap:18px}
.box{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:16px;min-width:0}
.comic-h{font-family:var(--f-comic);font-weight:400;letter-spacing:.04em;line-height:1;margin:0;text-wrap:balance}
h2.comic-h{font-size:1.75rem;margin-bottom:6px}
a{color:var(--s1)}
button,select,input,textarea{font-family:var(--f-body);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--s3);outline-offset:3px}
.ghost{border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);padding:6px 12px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink);font-size:.88rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.ghost:active{transform:translate(2px,2px);box-shadow:none}
.ghost[aria-pressed="true"]{background:var(--action)}
.ghost:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.ghost.sm{padding:3px 9px;font-size:.8rem}
.go{font-family:var(--f-comic);font-size:1.45rem;letter-spacing:.06em;padding:8px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--action);cursor:pointer;box-shadow:4px 4px 0 var(--ink);line-height:1.1;color:var(--ink);text-decoration:none;display:inline-block}
.go:hover:not(:disabled){transform:rotate(-1deg) scale(1.02)}
.go:active:not(:disabled){transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.chip{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;background:var(--paper)}
.chip.s1{background:var(--s1-t);border-color:var(--s1);color:var(--s1)}
.chip.s2{background:var(--s2-t);border-color:#1E7F37;color:#1E7F37}
.chip.s3{background:var(--s3-t);border-color:#B6411B;color:#B6411B}
.chip.s4{background:var(--s4-t);border-color:var(--s4);color:var(--s4)}
.muted{color:var(--muted)} .sm{font-size:.82rem}
.cap{font-size:.78rem;color:var(--muted)}

/* Kopf */
.top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:1000px){.top{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:center;align-content:start}
.logo{font-family:var(--f-comic);font-size:clamp(2rem,4.8vw,3.3rem);line-height:.95;letter-spacing:.03em;color:#FFB020;
  -webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);display:inline-block;margin:0;font-weight:400}
.logo.st-logo{font-size:clamp(1.7rem,3.6vw,2.6rem)}
.kicker{font-family:var(--f-comic);font-size:1.1rem;letter-spacing:.05em;color:var(--muted);display:block;margin-top:8px}
.tagline{font-weight:700;font-size:.93rem;margin-top:6px;max-width:68ch}
.owl{width:118px;height:auto;flex:none;border:3px solid var(--ink);border-radius:18px;background:#E4F3DD;box-shadow:3px 3px 0 var(--ink)}
.owl .blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{grid-column:1/-1;position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:600;font-size:.95rem;min-height:3.2em;margin-top:12px}
.bubble::before{content:"";position:absolute;left:44px;top:-18px;border:8px solid transparent;border-bottom:12px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:47px;top:-10px;border:5px solid transparent;border-bottom:8px solid var(--paper)}
.bubble b.who{font-family:var(--f-comic);font-weight:400;font-size:1.1rem;letter-spacing:.05em;color:var(--s4);display:block}
.hbtns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.akte{display:grid;gap:10px;align-content:start}
.lq{border:3px solid var(--ink);border-radius:12px;background:var(--narr);padding:10px 12px}
.lq small{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lq b{font-family:var(--f-comic);font-weight:400;font-size:1.35rem;letter-spacing:.03em;line-height:1.1;display:block}

/* Treppe */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.ladder button{border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 8px 6px;text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:grid;gap:2px;min-height:64px;position:relative}
.ladder button:nth-child(2){min-height:80px}
.ladder button:nth-child(3){min-height:96px}
.ladder button:nth-child(4){min-height:112px}
.ladder button b{font-family:var(--f-comic);font-weight:400;font-size:1.2rem;letter-spacing:.04em;line-height:1}
.ladder button small{font-size:.7rem;color:var(--muted);font-weight:700}
.ladder button[data-s="1"]{border-top:9px solid var(--s1)}
.ladder button[data-s="2"]{border-top:9px solid var(--s2)}
.ladder button[data-s="3"]{border-top:9px solid var(--s3)}
.ladder button[data-s="4"]{border-top:9px solid var(--s4)}
.ladder button.now{background:var(--action);transform:translateY(-3px)}
.ladder button.done::after{content:"✓";position:absolute;right:-8px;top:-14px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem;border:2px solid var(--ink)}
.ladder button:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:640px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))!important}.ladder button{min-height:60px!important}}

/* Arbeitsfläche */
.work{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.gbox{display:grid;gap:10px;align-content:start;position:sticky;top:12px}
@media (max-width:1000px){.work{grid-template-columns:1fr}.gbox{position:static}}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.maphead h2{font-size:1.45rem}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gframe{position:relative;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;touch-action:manipulation}
.gframe svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.gframe.pick{outline:4px dashed var(--s3);outline-offset:-4px}
.gframe.pick svg,.gframe.ruler svg{cursor:crosshair}
.gtitle{font-weight:800;font-size:.95rem;margin:0}
.mapnote{font-size:.74rem;color:var(--muted);margin:0}
.hint{font-size:.78rem;font-weight:700;background:var(--narr);border:2px solid var(--ink);border-radius:8px;padding:4px 8px}
svg .ax{stroke:var(--ink);stroke-width:2.4;fill:none}
svg .grid{stroke:#E3E8F0;stroke-width:1}
svg .grid.maj{stroke:#C9D2E0}
svg .tk{font:600 13px var(--f-body);fill:var(--ink)}
svg .axl{font:800 14px var(--f-body);fill:var(--ink)}
svg .curve{fill:none;stroke:#1E8FE0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
svg .dot{fill:#1E8FE0;stroke:#fff;stroke-width:2}
svg .note{font:800 12.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
svg .ref{stroke-width:2;stroke-dasharray:7 5;fill:none}
svg .reft{font:800 11.5px var(--f-body);paint-order:stroke;stroke:#fff;stroke-width:4px}
svg .zo{fill:none;stroke-width:16;stroke-linecap:round;opacity:.28;transition:opacity .15s}
svg .zo.hot{opacity:.6}
svg .zring{fill:none;stroke-width:4}
svg .zb circle{fill:#fff;stroke:var(--ink);stroke-width:2.5}
svg .zb text{font:800 13px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg .zb.hot circle{fill:var(--action)}
svg .zl rect{fill:var(--narr);stroke:var(--ink);stroke-width:2}
svg .zl text{font:800 12px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg .rl{stroke:var(--bad);stroke-width:2.2;stroke-dasharray:6 5;fill:none}
svg .rd{fill:var(--bad);stroke:#fff;stroke-width:2}
svg .pk.ok{fill:var(--good)} svg .pk.no{fill:var(--bad)}
svg .pk{stroke:var(--ink);stroke-width:2.5}
svg .hl{stroke:var(--s4);stroke-width:2.5;stroke-dasharray:3 4}

/* Aufgaben */
.tasks{display:grid;gap:14px;align-content:start}
.stephead{display:grid;gap:6px}
.stephead .kind{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stephead h2{font-size:1.9rem}
.card{border:2.5px solid var(--ink);border-radius:12px;padding:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);min-width:0;display:grid;gap:8px;align-content:start}
.card h3{font-family:var(--f-comic);font-weight:400;font-size:1.3rem;letter-spacing:.04em;margin:0;line-height:1.05;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3 .n{display:inline-grid;place-items:center;min-width:28px;height:28px;border:2.5px solid var(--ink);border-radius:50%;font-size:1rem;background:#fff}
.card.done{background:#F3FBF5}
.card.done h3 .n{background:var(--good);color:#fff}
.card.lock{opacity:.5;background:#F5F7FA;box-shadow:none}
.card p{margin:0;max-width:68ch}
.q{font-weight:700}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opts{display:grid;gap:6px}
.opt{border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:7px 10px;text-align:left;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.opt::before{content:"";flex:none;width:16px;height:16px;border:2.5px solid var(--ink);border-radius:50%;margin-top:2px;background:#fff}
.opt.right{background:#E5F7E8;border-color:var(--good)}
.opt.right::before{background:var(--good)}
.opt.wrong{background:var(--stein-t);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:8px 10px;font-size:.86rem;border:2.5px solid var(--ink)}
.fb.ok{background:#E5F7E8;border-color:var(--good)}
.fb.no{background:var(--stein-t);border-color:var(--bad)}
.fb.tip{background:var(--narr)}
.fb .stein{display:block;margin-top:4px;font-size:.8rem;color:var(--stein);font-weight:700}
.fb .stein::before{content:"🪨 Stolperstein: ";font-weight:800}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:800}
.numrow input{width:110px;border:2.5px solid var(--ink);border-radius:8px;padding:6px 8px;font-size:1rem;font-weight:700}
.numrow input.pin{width:84px;text-align:center}
.numrow .br{font-size:1.5rem;font-weight:400}

/* Ziehen und Ablegen */
.bankwrap{position:sticky;top:6px;z-index:5;background:#fff;padding:4px 0 2px;border-radius:10px}
.card.done .bankwrap{position:static}
.bank{display:flex;flex-wrap:wrap;gap:7px;padding:8px;border:2.5px dashed var(--ink);border-radius:10px;background:#FAFCFF;min-height:48px;align-items:center}
.bank:empty::before{content:"Alle Kärtchen sind verteilt.";font-size:.8rem;color:var(--muted);font-weight:700}
.bank.over{background:#FFFBE0}
.chipb{border:2.5px solid var(--ink);border-radius:999px;background:var(--narr);padding:4px 12px;font-weight:800;font-size:.86rem;cursor:grab;touch-action:none;box-shadow:2px 2px 0 var(--ink);user-select:none;-webkit-user-select:none;line-height:1.3}
.chipb[aria-pressed="true"]{background:var(--action);transform:translateY(-2px);box-shadow:0 0 0 3px var(--s3)}
.chipb.dragging{opacity:.3}
.chipb.placed{box-shadow:none;background:#fff;width:100%}
.ghost-drag{position:fixed;left:0;top:0;pointer-events:none;z-index:80;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:4px 4px 0 var(--ink)!important;background:var(--action)!important;width:auto!important}
.dz{display:inline-flex;min-width:130px;min-height:38px;border:2.5px dashed #8A93A6;border-radius:10px;background:#fff;align-items:center;justify-content:center;padding:2px;vertical-align:middle}
.dz.over{background:#FFFBE0;border-color:var(--s3);border-style:solid}
.dz.ok{border-style:solid;border-color:var(--good);background:#E5F7E8}
.dz.ok .chipb{background:#E5F7E8;border-color:var(--good)}
.dz.no{border-style:solid;border-color:var(--bad);background:var(--stein-t)}
.dz.no .chipb{background:var(--stein-t);border-color:var(--bad)}
.dzb{border:0;background:transparent;width:100%;min-height:32px;font-weight:800;color:#8A93A6;cursor:pointer;font-size:.8rem;border-radius:8px}
.dzrows{display:grid;gap:7px}
.dzrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.dzrow .dz{width:100%}
.zn{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:800;background:#fff;font-size:.9rem}
.dzrow.hot .zn{background:var(--action)}
.lab{font-weight:800;font-size:.85rem;min-width:84px}
.cloze{line-height:2.7;font-size:.95rem;border:2.5px solid var(--ink);border-radius:10px;padding:6px 12px;background:#fff}
.cloze .dz{min-width:104px;min-height:34px;margin:2px 0}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.pic{border:2.5px solid var(--ink);border-radius:10px;padding:6px;display:grid;gap:6px;background:#fff;align-content:start}
.pic svg{width:100%;height:60px;display:block}
.pic .dz{width:100%;min-width:0}

/* Schreiben */
.bau{border:2.5px solid var(--ink);border-radius:10px;padding:6px 10px;background:#fff}
details.bau summary{font-family:var(--f-comic);font-size:1.1rem;letter-spacing:.04em;cursor:pointer}
.bauplan{display:grid;gap:5px;margin:8px 0 6px}
.bp{border:2.5px solid var(--ink);border-radius:8px;padding:4px 8px;font-weight:700;font-size:.8rem}
.p1{background:#DDEBFB}.p2{background:#DDF6E3}.p3{background:#FFE2D7}.p4{background:#F9E3F0}
.wchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.wc{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:3px 10px;font-size:.8rem;font-weight:700;cursor:pointer}
.wc.st{background:var(--narr)}
.wc:hover{background:#FFFBE0}
.wsl{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
textarea{width:100%;min-height:120px;border:2.5px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:.92rem;line-height:1.45;resize:vertical}
.bpcheck{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bpi{border:2px dashed var(--ink);border-radius:999px;padding:1px 8px;font-size:.76rem;font-weight:700;background:#fff;color:var(--muted)}
.bpi.on{border-style:solid;color:var(--ink);background:#DDF6E3}
.own{border:2.5px solid var(--ink);border-radius:10px;background:var(--narr);padding:8px 10px;font-weight:600;white-space:pre-wrap}
.model{border:2.5px dashed var(--s4);border-radius:10px;background:var(--s4-t);padding:8px 10px;font-size:.88rem}
.model b{color:var(--s4)}

/* Stolpersteine */
.steine{border:3px solid var(--stein);border-radius:12px;background:var(--stein-t);padding:10px 12px;display:grid;gap:6px}
.steine h3{margin:0;font-family:var(--f-comic);font-weight:400;font-size:1.25rem;letter-spacing:.04em;color:var(--stein)}
.steine details{background:#fff;border:2px solid var(--stein);border-radius:8px;padding:4px 10px}
.steine summary{font-weight:800;font-size:.86rem;cursor:pointer}
.steine p{margin:4px 0;font-size:.85rem}
.steine .str{font-size:.82rem;border-left:4px solid var(--s1);padding-left:8px;margin:4px 0}
.next{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.win{border:3px solid var(--ink);border-radius:14px;background:var(--action);padding:12px 14px;box-shadow:4px 4px 0 var(--ink);display:grid;gap:8px}
.win b{font-family:var(--f-comic);font-weight:400;font-size:1.6rem;letter-spacing:.04em}

/* Dialoge, Tabellen */
.dlg{position:fixed;inset:0;background:rgba(27,27,47,.45);display:grid;place-items:center;z-index:50;padding:14px}
.dlg .box{max-width:820px;width:100%;max-height:88vh;overflow:auto}
.dlg h3{font-family:var(--f-comic);font-weight:400;font-size:1.3rem;letter-spacing:.04em;margin:14px 0 4px}
.dlg p,.dlg li{font-size:.9rem;max-width:78ch}
table.t{border-collapse:collapse;font-size:.84rem;width:100%}
table.t th,table.t td{border:2px solid var(--ink);padding:4px 6px;text-align:left;vertical-align:middle}
table.t th{background:var(--narr)}
table.t svg{width:64px;height:36px;display:block}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:.8rem;font-weight:700}
.foot a,.foot button{color:var(--ink);background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:.88rem;z-index:60;max-width:92vw}

/* Startseite */
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
a.st{display:grid;gap:8px;text-decoration:none;color:var(--ink);align-content:start;position:relative}
a.st:hover{transform:rotate(-.6deg)}
a.st .ill{width:100%;height:auto;border:2.5px solid var(--ink);border-radius:12px;background:#F4F8FF;display:block}
a.st h2{font-size:1.6rem}
a.st .meta{display:flex;gap:6px;flex-wrap:wrap}
a.st .prog{display:flex;gap:4px}
a.st .lp{border-top:2px dashed var(--line);padding-top:5px}
a.st .prog i{flex:1;height:10px;border:2px solid var(--ink);border-radius:5px;background:#fff}
a.st .prog i.on{background:var(--good)}
a.st .anum{position:absolute;right:12px;top:10px;width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--f-comic);font-size:1.4rem;background:var(--action)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.legend .card{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff}.toolbar,.hbtns,.next,.ctrls{display:none}.box{box-shadow:none}}
/* tv-earthlab: Knopf zurück zum Earth-Lab, unten rechts im einleitenden Block */.tv-el-row{display:flex;justify-content:flex-end;align-items:flex-end;grid-column:1/-1;flex:1 0 100%;width:100%;margin-top:10px;position:relative;z-index:1;box-sizing:border-box}.tv-el{display:inline-flex;align-items:center;gap:7px;border:2.5px solid #1B1B2F;border-radius:10px;background:#fff;color:#1B1B2F;padding:6px 12px;font:700 .92rem/1.2 "Lexend","Segoe UI",system-ui,sans-serif;letter-spacing:0;text-transform:none;text-decoration:none;box-shadow:2px 2px 0 #1B1B2F;white-space:nowrap;cursor:pointer}.tv-el:hover{background:#FFF3A6}.tv-el:active{transform:translate(2px,2px);box-shadow:none}.tv-el:focus-visible{outline:3px solid #FF6B3D;outline-offset:3px}.tv-el svg{width:1.3em;height:1.3em;flex:none;display:block}.tv-el .tv-el-spin{animation:tv-el-spin 6s linear infinite}@keyframes tv-el-spin{from{transform:translateX(0)}to{transform:translateX(-20px)}}@media (prefers-reduced-motion:reduce){.tv-el .tv-el-spin{animation:none}}@media print{.tv-el-row{display:none}}</style></head>

<h3>Aufbau</h3><p>Jede Station folgt derselben Treppe: <b>1 Orientieren</b> (Titel, Achsen, Einheiten, Kästchenwert) → <b>2 Ablesen</b> (Werte, Wertepaare, Differenzen) → <b>3 Verlauf benennen</b> (Fachbegriffe per Ziehen und Ablegen direkt am Graphen) → <b>4 Beschreiben</b> (Lückentext oder freies Schreiben mit Bauplan, Satzanfängen, Wortspeicher und Checkliste). Die Wörter-Kurve ist ein Einstiegstraining in drei Schritten. Die Stationen werden von oben nach unten anspruchsvoller: Minuswerte (Nordsee, Alpen), Höhe statt Zeit auf der x-Achse (Alpen), Grenzlinien (Rhein), Schwankung und Trend (Arktis), Achse ohne Null (Mauna Loa).</p>

/* ---------- Monotone Kurve (Fritsch-Carlson): Hoch- und Tiefpunkte liegen genau auf den Messwerten ---------- */
function mono(pts){const n=pts.length,X=pts.map(p=>p[0]),Y=pts.map(p=>p[1]),d=[],m=new Array(n);
 for(let i=0;i<n-1;i++)d[i]=(Y[i+1]-Y[i])/(X[i+1]-X[i]);

 const f=x=>{if(x<=X[0])return Y[0];if(x>=X[n-1])return Y[n-1];let i=0;while(x>X[i+1])i++;const h=X[i+1]-X[i],t=(x-X[i])/h,t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*Y[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*Y[i+1]+(t3-t2)*h*m[i+1]};

 return {f,segs,X,Y}}

function lin(pts){const X=pts.map(p=>p[0]),Y=pts.map(p=>p[1]),n=pts.length;
 const f=x=>{if(x<=X[0])return Y[0];if(x>=X[n-1])return Y[n-1];let i=0;while(x>X[i+1])i++;return Y[i]+(Y[i+1]-Y[i])*(x-X[i])/(X[i+1]-X[i])};
 const segs=[];for(let i=0;i<n-1;i++){const h=X[i+1]-X[i],d=Y[i+1]-Y[i];segs.push([X[i]+h/3,Y[i]+d/3,X[i+1]-h/3,Y[i+1]-d/3,X[i+1],Y[i+1]])}return {f,segs,X,Y}}

function makeGraph(host,g){
 const W=640,H=400,L=g.L||62,R=28,T=42,B=58,pw=W-L-R,ph=H-T-B;

 let s='';

 if(g.gx){for(let x=Math.ceil(x0/g.gx-1e-9)*g.gx;x<=x1+1e-9;x+=g.gx){if(x<=x0+1e-9)continue;s+=`<line class="grid" x1="${sx(x)}" y1="${T}" x2="${sx(x)}" y2="${T+ph}"/>`}}
 if(g.gy){for(let y=Math.ceil(y0/g.gy-1e-9)*g.gy;y<=y1+1e-9;y+=g.gy){if(y<=y0+1e-9)continue;const maj=g.ty&&Math.abs(y/g.ty-Math.round(y/g.ty))<1e-6;s+=`<line class="grid${maj?' maj':''}" x1="${L}" y1="${sy(y)}" x2="${L+pw}" y2="${sy(y)}"/>`}}
 // Bezugslinien
 (g.refs||[]).forEach(r=>{s+=`<line class="ref" style="stroke:${r.c||'#8A93A6'}" x1="${L}" y1="${sy(r.y)}" x2="${L+pw}" y2="${sy(r.y)}"/><text class="reft" style="fill:${r.c||'#4A5266'}" x="${L+pw-4}" y="${sy(r.y)-6}" text-anchor="end">${esc(r.t)}</text>`});

function dragify(el,onDrop,onTap){
 el.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();const x0=e.clientX,y0=e.clientY;let ghost=null,over=null;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>6){ghost=el.cloneNode(true);ghost.classList.add('ghost-drag');ghost.removeAttribute('aria-pressed');document.body.appendChild(ghost);el.classList.add('dragging')}
   if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY);const z=t&&(t.closest('.dz')||t.closest('.bank'));if(z!==over){over&&over.classList.remove('over');over=z;over&&over.classList.add('over')}}};
  const end=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);over&&over.classList.remove('over');
   if(ghost){ghost.remove();el.classList.remove('dragging');const t=ev.type==='pointerup'?document.elementFromPoint(ev.clientX,ev.clientY):null;onDrop(t&&t.closest('.dz'),t&&t.closest('.bank'))}else if(ev.type==='pointerup')onTap()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
 el.addEventListener('click',e=>{if(e.detail===0)onTap()});
}
const RISE=['steigt','steigt stark','steigt schwach','steigt (Flut)'],FALL=['fällt','fällt stark','fällt schwach','fällt (Ebbe)'],PTS=['Hochpunkt','Tiefpunkt','höchster Wert am Ende','tiefster Wert am Ende','beginnt im Ursprung','Hochwasser (Hochpunkt)','Niedrigwasser (Tiefpunkt)'];
function autoTip(z,given){const a=z.a,tips=z.tips||{};if(tips[given])return tips[given];
 const exR=a.some(x=>RISE.includes(x)),exF=a.some(x=>FALL.includes(x));
 if(exR&&FALL.includes(given)||exF&&RISE.includes(given))return {t:'Lest den Graphen von links nach rechts. Geht er hier nach oben oder nach unten?',st:'richtung'};
 if((exR&&RISE.includes(given))||(exF&&FALL.includes(given)))return {t:'Die Richtung stimmt! Vergleicht aber, wie steil dieser Abschnitt im Vergleich zu den anderen ist.',st:'steil'};
 if(PTS.includes(given)&&z.r)return {t:'Hier ist ein ganzer Abschnitt markiert. Dafür braucht ihr ein Verb wie steigt, fällt oder bleibt konstant.',st:'punkt'};
 if(!z.r&&z.x!=null&&!PTS.includes(given))return {t:'Hier ist nur eine einzelne Stelle markiert. Ist sie die höchste oder die tiefste Stelle in ihrer Umgebung?',st:'punkt'};
 if(given==='bleibt konstant'||given==='bleibt fast konstant')return {t:'Bleibt der Graph hier wirklich waagerecht? Fahrt mit dem Finger entlang.',st:'steil'};

function dnd(t,b,done,finish,ctx){

  else{body=`<div class="dzrows">${zones.map((z,zi)=>`<div class="dzrow" data-row="${zi}"><span class="zn" style="border-color:${ZC[zi%ZC.length]};color:${ZC[zi%ZC.length]}">${zi+1}</span>${zoneHTML(zi)}</div>`).join('')}</div>`}
  const inBank=order.filter(ci=>!place.includes(ci));
  b.innerHTML=`<p class="q">${t.q}</p>${done?'':`<div class="bankwrap"><span class="wsl">Kärtchen – ziehen oder antippen und dann ein Feld antippen</span><div class="bank" aria-label="Kärtchen">${inBank.map(ci=>`<button class="chipb" type="button" data-c="${ci}" aria-pressed="${sel===ci}">${esc(chips[ci])}</button>`).join('')}</div></div>`}${body}${done?'':`
   <div class="ctrls"><button class="ghost" type="button" data-chk>✔ Prüfen</button><button class="ghost sm" type="button" data-rst>Alles zurück</button></div>`}<div class="out"></div>`;
  if(done){if(t.after)$('.out',b).innerHTML=`<div class="fb ok">${t.after}</div>`;return}

    if(place.includes(ci)){if(sel!=null&&sel!==ci){put(sel,place.indexOf(ci))}else back(ci)}else{sel=sel===ci?null:ci;draw();const n=$(`.bank [data-c="${ci}"]`,b);n&&n.focus()}})});
  $$('.dzb',b).forEach(el=>el.onclick=()=>{if(sel!=null)put(sel,+el.dataset.zb);else toast('Tippt zuerst ein Kärtchen an.')});
  $('[data-chk]',b).onclick=check;$('[data-rst]',b).onclick=()=>{place.fill(null);sel=null;marks=null;draw()};
  if(t.mode==='graph'&&ctx.graph){$$('.dzrow',b).forEach(r=>{const i=+r.dataset.row;const on=v=>{r.classList.toggle('hot',v);ctx.graph.hot(i,v)};r.onmouseenter=()=>on(true);r.onmouseleave=()=>on(false);r.addEventListener('focusin',()=>on(true));r.addEventListener('focusout',()=>on(false))})}
 }

 draw();
}

  $$('.wc',b).forEach(c=>c.onclick=()=>ins(ta,c.dataset.t));
  $('[data-model]',b).onclick=()=>{$('.mod',b).innerHTML=`<div class="model"><b>Vorschlag von Frau Prof. Geo:</b> ${t.model}<div class="ctrls" style="margin-top:6px"><button class="ghost sm" type="button" data-take>Vorschlag übernehmen und weiter</button></div></div>`;
   $('[data-take]',b).onclick=()=>{S.txt[k]=t.model.replace(/<[^>]+>/g,'');save();finish('Lest den Vorschlag laut vor und vergleicht ihn mit eurem eigenen Versuch: Was hat Frau Prof. Geo zusätzlich genannt?')}};
  $('[data-save]',b).onclick=()=>{const v=ta.value.trim();const out=$('.out',b);
   if(v.length<(t.min||80)){fbBox(out,'tip','Euer Text ist noch sehr kurz. Schreibt mindestens drei Sätze mit den Bausteinen aus dem Bauplan.');return}
   if(/\bweil\b|\bda\s+(es|der|die|das)\b|deshalb|darum/i.test(v)&&!t.allowWeil){fbBox(out,'tip','In eurem Text steht eine Begründung (z. B. „weil“). Beim Beschreiben bleibt ihr beim Graphen. Streicht die Begründung oder hebt sie für später auf.','erklaeren');return}
   const miss=t.checks.filter((c,i)=>!tests[i].test(v));
   if(miss.length){fbBox(out,'tip',`Es fehlt noch: <b>${miss.map(c=>esc(c.l)).join(', ')}</b>.`,miss.some(c=>/wert|zahl|°|m\b|ppm/i.test(c.l))?'zahlen':null);return}
   S.txt[k]=v;save();finish(t.ok||'Klasse beschrieben! Vergleicht euren Text jetzt noch mit dem Vorschlag von Frau Prof. Geo.')};
 }};
function ins(ta,t){t=t.replace(/\s*…\s*$/,' ');const s0=ta.selectionStart??ta.value.length,e0=ta.selectionEnd??s0,v=ta.value,pre=v.slice(0,s0),post=v.slice(e0);const sp=(pre&&!/\s$/.test(pre))?' ':'';ta.value=pre+sp+t+post;const p=(pre+sp+t).length;ta.focus();try{ta.setSelectionRange(p,p)}catch(e){}ta.dispatchEvent(new Event('input'))}

/* ---------- Station ---------- */
const tkey=(si,ti)=>si+'.'+ti;
function stepDone(si){return C.steps[si].tasks.every((t,ti)=>S.done[tkey(si,ti)])}
function renderStation(st){C=st;KEY='gm-graph-'+st.id;S=load(KEY)||{step:0,max:0,done:{},txt:{}};
 C.steps.forEach((s,si)=>s.tasks.forEach((t,ti)=>{t.key='t'+si+'_'+ti}));
 const n=C.steps.length;
 app.innerHTML=`<div class="top">
  <section class="box hero" aria-label="Station ${esc(st.t)}">${AVATAR}
   <div><a class="ghost sm" href="#" style="margin-bottom:8px">← Alle Stationen</a><br><span class="chip">${esc(st.jg)}</span> <span class="chip">${esc(st.r)}</span><h1 class="logo st-logo">${esc(st.t)}</h1><span class="kicker">${esc(st.k)}</span></div>
   <div class="bubble" id="bubble" aria-live="polite"></div>
   <div class="hbtns"><button class="ghost" type="button" data-merk>📌 Merkkasten</button><button class="ghost" type="button" data-form>💬 Formulierungshilfen</button><button class="ghost sm" type="button" data-reset>↺ Station neu starten</button></div>${EARTH}
  </section>
  <section class="box akte" aria-label="Treppe"><div class="lq"><small>Die Treppe der Graphenauswertung</small><b>${n===4?'Vier Stufen, die aufeinander aufbauen':'Erst die Wörter, dann die Graphen'}</b></div><div class="ladder" id="lad" style="grid-template-columns:repeat(${n},minmax(0,1fr))"></div></section>
 </div>
 <div class="work">
  <section class="box gbox"><div class="maphead"><h2 class="comic-h">Der Graph</h2><div class="toolbar"><button class="ghost sm" type="button" id="bRuler" aria-pressed="false">📏 Ablese-Lineal</button></div></div>
   <p class="gtitle">${esc(st.graph.title)}</p><div class="gframe" id="gf"></div><p class="mapnote">${st.src}</p></section>
  <section class="tasks" id="tasks"></section>
 </div>`;
 G=makeGraph($('#gf'),st.graph);
 $('#bRuler').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);G.setRuler(on);if(on)toast('Tippt oder wischt auf dem Graphen: Die roten Linien zeigen euch den Weg zu den Achsen.')};
 $('[data-merk]').onclick=showMerk;$('[data-form]').onclick=showForm;
 $('[data-reset]').onclick=()=>{const d=dialog('Station neu starten?','<p>Wollt ihr diese Station wirklich von vorn beginnen? Euer Fortschritt in dieser Station wird gelöscht.</p><div class="ctrls"><button class="go" type="button" data-yes>Ja, neu starten</button><button class="ghost" type="button" data-x>Abbrechen</button></div>');
  $('[data-yes]',d).onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}d.remove();renderStation(st);window.scrollTo(0,0)}};
 goStep(Math.min(S.step,S.max));
 if(!S.seen){S.seen=1;save();say(st.hello)}
}
function ladder(){const lad=$('#lad');lad.innerHTML=C.steps.map((s,i)=>`<button type="button" data-s="${i+1}" class="${i===S.step?'now':''} ${(S.max>i||(i===C.steps.length-1&&S.fin))?'done':''}" ${i>S.max?'disabled':''}><b>${i+1} ${esc(s.n)}</b><small>${esc(s.k)}</small></button>`).join('');
 $$('button',lad).forEach((b,i)=>b.onclick=()=>goStep(i))}
function goStep(i){S.step=i;save();ladder();renderTasks();say(C.steps[i].bubble);}
function renderTasks(keepFocus){const si=S.step,stp=C.steps[si],box=$('#tasks');const c=['s1','s2','s3','s4'][si%4];
 const first=stp.tasks.findIndex((t,ti)=>!S.done[tkey(si,ti)]);
 box.innerHTML=`<div class="stephead"><div class="kind"><span class="chip ${c}">Stufe ${si+1} von ${C.steps.length}</span></div><h2 class="comic-h">${esc(stp.n)}: ${esc(stp.k)}</h2></div>`+
  stp.tasks.map((t,ti)=>{const d=!!S.done[tkey(si,ti)],lock=first>=0&&ti>first;return `<article class="card${d?' done':''}${lock?' lock':''}" data-t="${ti}"><h3><span class="n">${d?'✓':ti+1}</span>${esc(t.h||'Aufgabe '+(ti+1))}</h3><div class="body">${lock?'<p class="cap">Wird freigeschaltet, sobald die Aufgabe davor gelöst ist.</p>':''}</div></article>`}).join('')+
  `<div id="nextbox"></div>`+(stp.steine?`<section class="steine"><h3>🪨 Stolpersteine auf dieser Stufe</h3>${stp.steine.map(k=>{const s=D.stein[k];return `<details><summary>${esc(s.t)}</summary><p>${s.p}</p><p class="str"><b>Strategie:</b> ${s.s}</p></details>`}).join('')}</section>`:'');
 const ctx={graph:G,pick:null};
 G.setPick(null);G.setZones(null);G.helpLine(null);
 stp.tasks.forEach((t,ti)=>{const d=!!S.done[tkey(si,ti)];if(first>=0&&ti>first)return;const b=$(`[data-t="${ti}"] .body`,box);
  TYPES[t.type](t,b,d,msg=>{S.done[tkey(si,ti)]=true;save();if(msg)say(msg);setTimeout(()=>{renderTasks(true);const nx=$(`[data-t="${ti+1}"]`,box)||$('#nextbox');nx&&nx.scrollIntoView({behavior:'smooth',block:'nearest'})},msg?650:0)},ctx)});
 // Graph passend zur aktiven Aufgabe
 const act=first>=0?stp.tasks[first]:null;
 const solvedDnd=stp.tasks.find((t,ti)=>t.mode==='graph'&&S.done[tkey(si,ti)]);
 if(act&&act.type==='dnd'&&act.mode==='graph')G.setZones(act.zones,null);
 else if(solvedDnd)G.setZones(solvedDnd.zones,solvedDnd.zones.map(z=>z.show||z.a[0]));
 if(act&&act.hl!=null)G.helpLine(act.hl);
 if(act&&act.type==='pick'&&ctx.pick)G.setPick(ctx.pick);
 // Weiter
 const nb=$('#nextbox');if(first<0){const last=si===C.steps.length-1;
  if(!last){S.max=Math.max(S.max,si+1);save();ladder();nb.innerHTML=`<div class="next"><button class="go" type="button">Weiter zu Stufe ${si+2}: ${esc(C.steps[si+1].n)} →</button></div>`;$('button',nb).onclick=()=>{goStep(si+1);window.scrollTo({top:0,behavior:'smooth'})}}
  else{S.fin=true;save();ladder();const nxt=ST[ST.indexOf(C)+1];nb.innerHTML=`<div class="win"><b>🏆 Station geschafft!</b><p class="sm" style="margin:0">${C.win||'Ihr habt den Graphen gelesen, seinen Verlauf benannt und ihn beschrieben.'}</p><div class="ctrls">${nxt?`<a class="go" href="#${nxt.id}">Nächste Station: ${esc(nxt.t)} →</a>`:''}<a class="ghost" href="#">Zur Übersicht</a></div></div>`;if(!keepFocus)return}}
}

/* ---------- Dialoge ---------- */
function showMerk(){const terms=['beginnt im Ursprung','steigt','steigt stark','steigt schwach','fällt','fällt stark','fällt schwach','bleibt konstant','schwankt','Hochpunkt','Tiefpunkt'];
 dialog('📌 Merkkasten: Graphen lesen',`
 <h3>1 Orientieren: Worum geht es?</h3><ul><li>Lest den <b>Titel</b>: Was wird gezeigt, wo und wann?</li><li>Die <b>x-Achse</b> ist die waagerechte Achse, die <b>y-Achse</b> die senkrechte. Lest bei beiden, was sie zeigen und in welcher <b>Einheit</b> (z. B. °C, m, km, Uhrzeit in h).</li><li>Prüft, wie viel <b>ein Kästchen</b> wert ist und wo die Achsen <b>beginnen</b>.</li></ul>
 <h3>2 Ablesen: Welche Werte zeigt der Graph?</h3><p>Jeder Punkt auf dem Graphen verrät zwei Werte: einen auf der x-Achse und einen auf der y-Achse. Zusammen sind sie ein <b>Wertepaar</b>. Man schreibt es so: <b>(x|y)</b>. Der x-Wert steht immer vorne.</p><p>Beispiel: (14|44) heißt „um 14 Uhr sind es 44 °C“. Zum Ablesen geht ihr vom x-Wert <b>senkrecht nach oben</b> bis zum Graphen und von dort <b>waagerecht</b> zur y-Achse.</p>
 <h3>3 Verlauf benennen: Wie verläuft der Graph?</h3><p>Lest den Graphen immer <b>von links nach rechts</b>. Diese Fachbegriffe helfen euch:</p>
 <table class="t"><tr><th>Bild</th><th>Fachbegriff</th><th>Das bedeutet …</th></tr>${terms.map(k=>`<tr><td>${mini(k)}</td><td><b>${k}</b></td><td>${D.meaning[k]}</td></tr>`).join('')}</table>
 <p><b>Trend:</b> Wenn ein Graph stark schwankt, hilft eine <b>Trendlinie</b>. Sie zeigt die allgemeine Richtung, zum Beispiel: Die Werte schwanken, insgesamt fallen sie aber.</p><p><b>Höchster oder tiefster Wert am Ende:</b> Steigt ein Graph bis zum Schluss, ist der letzte Wert der höchste, aber kein Hochpunkt. Ein Hochpunkt liegt nur dort, wo der Graph danach wieder fällt.</p>
 <h3>4 Beschreiben: In ganzen Sätzen</h3><p>Erst das Thema, dann der Gesamtverlauf, dann die Abschnitte der Reihe nach, dabei die wichtigen Werte mit Einheit. Nur beschreiben, <b>nicht erklären</b> (kein „weil“). Mehr dazu unter 💬 Formulierungshilfen.</p>`)}
function showForm(){dialog('💬 Formulierungshilfen',`
 <h3>Bauplan einer Graphbeschreibung</h3><div class="bauplan">${D.bauplan.map((x,i)=>`<div class="bp p${i+1}"><b>${i+1} ${esc(x.n)}:</b> ${esc(x.t)}<br><span class="muted">z. B. ${esc(x.bsp)}</span></div>`).join('')}</div>
 <h3>Verben für den Verlauf</h3><p>steigt (an) · steigt stark / steil · steigt schwach / leicht · steigt gleichmäßig · fällt / sinkt · fällt stark / schwach · bleibt (fast) konstant · erreicht den Hochpunkt / Tiefpunkt · erreicht den höchsten Wert</p>
 <h3>Reihenfolgewörter</h3><p>Zuerst … · Am Anfang … · Dann … · Danach … · Anschließend … · Ab … · Bis … · Zum Schluss … · Am Ende …</p>
 <h3>Werte nennen</h3><p>… bei 14 Uhr mit 44 °C · … am 8. Januar mit 8,78 m · … nach 12 km auf 1141 m Höhe · … von 25 °C auf 44 °C · … um etwa 20 °C</p>
 <h3>Achtung</h3><p>Beim Beschreiben sagt ihr, <b>was</b> der Graph zeigt. Wörter wie „weil“, „deshalb“ oder „da“ gehören zum Erklären. Das ist der nächste Schritt.</p>`)}
function showTeacher(){dialog('Für Lehrkräfte',(D.teacherIntro||'')+`<table class="t"><tr><th>Station</th><th>Jg.</th><th>Schwerpunkt</th><th>Lehrplanbezug</th></tr>${ST.map(s=>`<tr><td><b>${esc(s.t)}</b><br><span class="cap">${esc(s.r)}</span></td><td>${esc(s.jg.replace('Jahrgang ',''))}</td><td>${esc(s.fo)}</td><td>${(s.lp||[]).map(x=>`<b>${esc(x[0])}:</b> ${esc(x[1])}`).join('<br>')}</td></tr>`).join('')}</table>`+(D.teacherOutro||''))}
function showSources(){dialog('Datengrundlage',`<p>Alle Graphen sind für Jahrgang 5 bis 7 vereinfacht. Die Kurven verlaufen glatt durch die angegebenen Werte; Hoch- und Tiefpunkte liegen genau auf den Messwerten.</p><table class="t"><tr><th>Station</th><th>Werte</th></tr>${ST.map(s=>`<tr><td><b>${esc(s.t)}</b></td><td>${s.src}</td></tr>`).join('')}</table><p class="cap">Der Fortschritt bleibt nur in diesem Browser gespeichert. Es werden keine Daten verschickt.</p>`)}

/* ---------- Startseite ---------- */
function renderHome(){C=null;
 const prog=s=>{const g=load('gm-graph-'+s.id);return s.steps.map((_,i)=>!!g&&(g.max>i||(i===s.steps.length-1&&!!g.fin)))};
 app.innerHTML=`<div class="top">
  <section class="box hero" aria-label="Graphen lesen mit Frau Prof. Geo">${AVATAR}
   <div><span class="chip">GeoMethode</span> <span class="chip">Jahrgang 5 bis 7</span><h1 class="logo">Graphen lesen</h1><span class="kicker">Graphen lesen und beschreiben mit Frau Prof. Geo</span>
   <div class="tagline">Ein Graph erzählt eine Geschichte: wie warm es in der Wüste wird, wie kalt es auf der Zugspitze ist oder wie viel Eis in der Arktis schmilzt. In zehn Stationen lernt ihr, Graphen zu lesen, ihren Verlauf mit Fachbegriffen zu benennen und sie in eigenen Sätzen zu beschreiben.</div></div>
   <div class="bubble" id="bubble"><b class="who">Frau Prof. Geo</b>Hallo! Ich bin Frau Prof. Geo. Fangt am besten mit der Wörter-Kurve an. Dort lernt ihr die wichtigsten Fachbegriffe. Danach geht es auf Reisen: in die Wüste, an die Nordsee, in die Alpen, an den Rhein, in die Arktis und bis nach Hawaii!</div>
   <div class="hbtns"><button class="ghost" type="button" data-merk>📌 Merkkasten</button><button class="ghost" type="button" data-form>💬 Formulierungshilfen</button>${REPO?'<a class="ghost" href="begleitheft.html">Für Lehrkräfte</a>':'<button class="ghost" type="button" data-teach>Für Lehrkräfte</button>'}</div>${EARTH}
  </section>
  <section class="box akte" aria-label="Die vier Stufen"><div class="lq"><small>Die Treppe der Graphenauswertung</small><b>Vier Stufen, die aufeinander aufbauen</b></div>
   <div class="ladder" id="lad">${D.stufen.map((s,i)=>`<button type="button" data-s="${i+1}" data-k="${i}"><b>${i+1} ${esc(s.n)}</b><small>${esc(s.d)}</small></button>`).join('')}</div>
   <p class="cap" style="margin:0">Wer beschreiben will, muss vorher die Achsen verstanden, Werte abgelesen und den Verlauf benannt haben.</p></section>
 </div>
 <main class="stations">${ST.map((s,i)=>{const p=prog(s);return `<a class="box st" href="#${s.id}"><span class="anum">${i+1}</span><span class="meta"><span class="chip">${esc(s.jg)}</span><span class="chip">${esc(s.r)}</span></span><h2 class="comic-h">${esc(s.t)}</h2>${ill(s)}<p class="sm" style="margin:0"><b>${esc(s.k)}</b></p><p class="cap" style="margin:0">${esc(s.fo)}</p>${s.lp&&!REPO?`<p class="cap lp" style="margin:0">📚 ${s.lp.map(x=>`<b>${esc(x[0])}:</b> ${esc(x[1])}`).join(' · ')}</p>`:''}<span class="prog" title="Fortschritt in diesem Browser">${p.map(d=>`<i class="${d?'on':''}"></i>`).join('')}</span><span class="go" style="text-align:center">Station starten</span></a>`}).join('')}</main>
 <section class="box"><h2 class="comic-h">So arbeitet ihr</h2><div class="legend">
  <div class="card"><b>📈 Links der Graph</b><p class="sm">Mit dem 📏 Ablese-Lineal tippt ihr auf eine Stelle. Rote Linien zeigen den Weg zur x- und zur y-Achse. Bei manchen Aufgaben tippt ihr direkt auf den Graphen.</p></div>
  <div class="card"><b>🧩 Rechts die Aufgaben</b><p class="sm">Begriffe zieht ihr mit dem Finger oder der Maus in die Felder. Oder ihr tippt erst ein Kärtchen und dann ein Feld an. Mit „Prüfen“ seht ihr, was schon stimmt.</p></div>
  <div class="card"><b>🪨 Stolpersteine</b><p class="sm">Unter jeder Stufe stehen Fehler, die vielen passieren, und eine Strategie dagegen. Auch falsche Antworten verraten euch, welcher Stolperstein im Weg lag.</p></div>
  <div class="card"><b>💾 Fortschritt</b><p class="sm">Euer Fortschritt bleibt in diesem Browser gespeichert. Es werden keine Daten verschickt. Am besten arbeitet ihr zu zweit an einem Gerät.</p></div>
 </div></section>
 <nav class="foot"><button type="button" data-merk>Merkkasten</button>${REPO?'<a href="begleitheft.html">Für Lehrkräfte</a>':'<button type="button" data-teach>Für Lehrkräfte</button>'}<button type="button" data-src>Datengrundlage</button>${REPO?'<a href="../../klimasimulation/impressum.html">Impressum</a><a href="../../index.html">Prof. Geos Erdlabor</a>':''}</nav>${REPO?'<p class="cap" style="text-align:center;margin:0">© 2026 Andreas Bauer · Schriften Bangers und Lexend: SIL Open Font License</p>':''}`;
 $$('[data-merk]').forEach(b=>b.onclick=showMerk);$$('[data-form]').forEach(b=>b.onclick=showForm);$$('[data-teach]').forEach(b=>b.onclick=showTeacher);$$('[data-src]').forEach(b=>b.onclick=showSources);
 $$('#lad button').forEach(b=>b.onclick=()=>{const s=D.stufen[+b.dataset.k];say(`<b>Stufe ${+b.dataset.k+1}: ${esc(s.n)}.</b> ${s.l}`);$$('#lad button').forEach(x=>x.classList.toggle('now',x===b))});
}

function route(){const id=location.hash.slice(1);const st=ST.find(s=>s.id===id);if(st)renderStation(st);else renderHome();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
})();

</script>
</body></html>
