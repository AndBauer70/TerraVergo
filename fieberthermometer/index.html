<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fieberthermometer des Klimawandels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  /* Arbeitsheft-Stil wie „Wer macht die Schanze?“: Papier, Stationsreiter, Panels, Materialkarten. Ocker = Bergteam, Petrol = Meeresteam, Blau = gemeinsam */
  --paper:#F1F3F2; --surface:#FBFBFA; --sunk:#E6E9E8;
  --ink:#1A2126; --ink-2:#4A545B; --ink-3:#6E7880; --line:#D2D7D8; --line-2:#B3BBBE;
  --berg:#8A5A14; --berg-soft:#F2E9DA; --meer:#1F5C66; --meer-soft:#DCE8E9; --joint:#2A549E; --joint-soft:#E1E7F3;
  --ok:#2C7444; --ok-soft:#DFEEE3; --bad:#A33A25; --bad-soft:#F4E2DD; --warn:#9A6A10; --good:#2C7444; --cold:#2A6FB0;
  --accent:var(--ink); --accent-soft:var(--sunk); --accent-ink:#FFFFFF;
  --hm-land:#E8ECEA; --hm-water:#C8D8DF; --hm-water-t:#7895A2; --hm-line:#B9C1C4; --hm-green:#CFE0CA; --hm-rock:#D9D6CF; --hm-label:#68727A;
  --hm-veil:rgba(241,243,242,.94); --hm-veil-m:rgba(241,243,242,.78);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#111517; --surface:#181D20; --sunk:#20262A; --ink:#E3E8EA; --ink-2:#A8B1B6; --ink-3:#87919A; --line:#2D3539; --line-2:#465156;
  --berg:#E2B46A; --berg-soft:#2C2416; --meer:#7EC1CB; --meer-soft:#1C3236; --joint:#90AEEE; --joint-soft:#1D2A44;
  --ok:#74C98E; --ok-soft:#1A3123; --bad:#EE8E79; --bad-soft:#3A2019; --warn:#E3B055; --good:#74C98E; --cold:#7FB2EC;
  --accent-ink:#0B1A1D;
  --hm-land:#182024; --hm-water:#1C3039; --hm-water-t:#6A8796; --hm-line:#34404A; --hm-green:#1C2F24; --hm-rock:#262B2E; --hm-label:#8A949C;
  --hm-veil:rgba(17,21,23,.9); --hm-veil-m:rgba(17,21,23,.74); color-scheme:dark}}
body[data-role="berg"]{--accent:var(--berg);--accent-soft:var(--berg-soft)}
body[data-role="meer"]{--accent:var(--meer);--accent-soft:var(--meer-soft)}
body[data-zone="joint"]{--accent:var(--joint);--accent-soft:var(--joint-soft)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display);font-weight:700;text-transform:uppercase}
h1{font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:.92;letter-spacing:.005em}
h1 .lo{color:var(--meer)} h1 .hi{color:var(--berg)}
h2{font-size:1.5rem;letter-spacing:.03em;line-height:1.05}
h3{font-size:1.15rem;letter-spacing:.04em;line-height:1.1}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.eyebrow,.lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:18px;align-items:start}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);line-height:1.3;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.accent{color:var(--accent-ink)}}
.btn.accent:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:var(--surface)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.notice{border:1px solid var(--line-2);border-left:4px solid var(--warn);background:var(--surface);padding:10px 14px;border-radius:6px;font-size:14px}

/* Kopf mit schematischer Karte */
.hero{position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);border-radius:8px;background:var(--hm-land);min-height:290px;display:grid;align-items:end;margin-bottom:18px}
.hero-map{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,var(--hm-veil) 0%,var(--hm-veil) 36%,transparent 68%)}
.hero-in{padding:28px 22px 22px;max-width:640px;display:grid;gap:10px}
.hero .lede{max-width:60ch;color:var(--ink-2)}
.hero .note{font-size:13px;color:var(--ink-3)}
@media (max-width:760px){.hero::before{background:var(--hm-veil-m)}.hero{min-height:0}}
.hero-map text{font-family:var(--f-body)}
.hm-land{fill:var(--hm-land)} .hm-water{fill:var(--hm-water)} .hm-rock{fill:var(--hm-rock)} .hm-green{fill:var(--hm-green)}
.hm-c{fill:none;stroke:var(--hm-line);stroke-width:1.2}
.hm-lat{stroke:var(--hm-line);stroke-width:1;stroke-dasharray:4 6}
.hm-dist{font-family:var(--f-display)!important;font-weight:600;font-size:15px;letter-spacing:.18em;fill:var(--hm-label)}
.hm-water-t{font-style:italic;font-size:17px;letter-spacing:.06em;fill:var(--hm-water-t)}
.hm-small{font-family:var(--f-mono)!important;font-size:10.5px;fill:var(--hm-label)}
.hm-halo{paint-order:stroke;stroke:var(--hm-land);stroke-width:4px;stroke-linejoin:round}
.hm-arrow-b{fill:none;stroke:var(--berg);stroke-width:3;stroke-linecap:round}
.hm-arrow-m{fill:none;stroke:var(--meer);stroke-width:3;stroke-linecap:round}
.hm-name-b{font-family:var(--f-display)!important;font-weight:700;font-size:20px;letter-spacing:.08em;fill:var(--berg)}
.hm-name-m{font-family:var(--f-display)!important;font-weight:700;font-size:20px;letter-spacing:.08em;fill:var(--meer)}
.hm-band{fill:var(--berg);fill-opacity:.28}
.hm-cod{fill:var(--meer);fill-opacity:.35}

/* Lobby */
.lobby{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.codein{font-family:var(--f-mono);font-size:1.5rem;letter-spacing:.3em;text-transform:uppercase;width:8ch;padding:6px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.rolecard{text-align:left;border:1px solid var(--line);border-top:5px solid var(--accent);background:var(--surface);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.rolecard[data-r="berg"]{--accent:var(--berg)} .rolecard[data-r="meer"]{--accent:var(--meer)}
.rolecard:hover{border-color:var(--accent)}
.rolecard h3{color:var(--accent);font-size:1.6rem}
.bigcode{font-family:var(--f-mono);font-size:2.3rem;letter-spacing:.25em;font-weight:600}
.ablauf{margin:0;padding-left:20px;display:grid;gap:6px;max-width:84ch}

/* Kopfleiste und Stationsreiter */
.apphead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-bottom:8px}
.apphead .who-am-i{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.rolebadge{font-family:var(--f-display);font-size:1.6rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;line-height:1}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-bottom:16px}
.steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.steps button{flex:none;display:inline-flex;align-items:baseline;gap:7px;font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:.05em;text-transform:uppercase;padding:9px 11px 6px;color:var(--ink-3);border:0;border-bottom:3px solid transparent;background:transparent}
.steps button .n{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:0}
.steps button:hover:not(:disabled){color:var(--ink-2)}
.steps button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps button.done .n::after{content:" ✓";color:var(--ok)}
.steps button:disabled{opacity:.5;cursor:default}
.steps .sep{flex:none;width:1px;background:var(--line-2);margin:8px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:2px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.chip.ok .dot{background:var(--ok)} .chip.wait .dot{background:var(--warn)}
.localbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border:1px dashed var(--line-2);border-radius:6px;background:var(--sunk);margin-bottom:16px;font-size:14px}

/* Schritt-Kopf */
.stephead{margin-bottom:16px}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stepno{font-family:var(--f-mono);font-weight:600;font-size:13px;min-width:26px;height:26px;padding:0 5px;display:inline-grid;place-items:center;border-radius:4px;background:var(--accent);color:#fff;flex:none}
@media (prefers-color-scheme: dark){.stepno{color:var(--accent-ink)}}
.intro{max-width:76ch;color:var(--ink-2)}

/* Material */
.fact{border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;display:grid}
.fact .mat-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--sunk);border-radius:6px 6px 0 0}
.mid{font-family:var(--f-mono);font-weight:600;font-size:12px;color:#fff;background:var(--accent);padding:1px 6px;border-radius:4px}
@media (prefers-color-scheme: dark){.mid{color:var(--accent-ink)}}
.fact .src{font-size:12.5px;color:var(--ink-3)}
.fact .mat-b{padding:10px 12px 12px;font-size:14.5px;line-height:1.55}

/* Aufgaben */
.task{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;background:var(--surface);padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}
.task > b{font-family:var(--f-display);font-size:1.12rem;letter-spacing:.04em;text-transform:uppercase}
.task > p{font-size:14.5px;max-width:80ch}
.op{font-weight:700}
.afb{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:6px;white-space:nowrap;font-weight:500;text-transform:none;letter-spacing:0}
.check{border-radius:6px;padding:12px 14px;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.check > b{color:var(--ok);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:1.08rem}
.check p{font-size:14.5px;max-width:84ch}
textarea,input[type=text],input[type=number]{font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.45}
textarea.short{min-height:58px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font-weight:700;font-size:13.5px;padding:6px 11px;background:transparent;color:var(--ink-2);border:0;border-left:1px solid var(--line-2);line-height:1.3}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.choice{display:grid;gap:6px}
.choice button{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 12px;font-size:14.5px}
.choice button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent);background:var(--accent-soft);font-weight:700}

/* Diagramme und Tabellen */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--ink-3)}
.chart .lbl{fill:var(--ink);font-size:11.5px;text-transform:none;letter-spacing:0}
.ax{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);align-items:center}
.sw{display:inline-block;width:14px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.kpi .eyebrow{font-size:10.5px}
.kpi .v{font-family:var(--f-mono);font-weight:600;font-size:1.25rem}
.species{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.sp{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.sp[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent);background:var(--accent-soft)}
.sp .wing{height:9px;border-radius:5px}
.sites{display:flex;flex-wrap:wrap;gap:8px}
table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;font-size:14px}
.tbl thead th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tbl td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.status{display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:11.5px;padding:1px 7px;border-radius:4px;white-space:nowrap}
.st-up{background:color-mix(in srgb,var(--cold) 16%,transparent);color:var(--cold)}
.st-eq{background:var(--sunk);color:var(--ink-3)}
.st-down{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st-gone{background:var(--bad-soft);color:var(--bad)}
.st-new{background:var(--ok-soft);color:var(--ok)}
.vgrid th,.vgrid td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
.vgrid thead th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.vbadge{font-family:var(--f-mono);font-weight:600;font-size:12.5px;padding:2px 8px;border-radius:4px}
.locked{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-style:italic;font-size:14px}

/* Mustertabelle */
.mt{overflow-x:auto}
.mt table{min-width:860px;background:var(--surface);border-radius:8px}
.mt th,.mt td{border:1px solid var(--line);padding:9px 10px;vertical-align:top;text-align:left;font-size:14px}
.mt thead th{font-family:var(--f-display);font-size:1.12rem;text-transform:uppercase;letter-spacing:.04em;background:var(--sunk)}
.mt thead th.b{color:var(--berg)} .mt thead th.m{color:var(--meer)} .mt thead th.j{color:var(--joint)}
.mt tbody th{width:20%;background:var(--sunk);font-weight:700}
.mt td{width:26.6%}
.mt td.mine{box-shadow:inset 0 0 0 2px var(--accent)}
.mt td .ro{white-space:pre-wrap}
.mt td textarea{min-height:72px}
.syn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:8px}
.sync{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--surface);display:flex;flex-direction:column;gap:6px;font-size:14px}
.sync.hl{border-color:var(--joint);box-shadow:inset 4px 0 0 var(--joint)}
.sync .seg button{font-size:12.5px;padding:4px 9px}
.grouph{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.steck .f{display:flex;flex-direction:column;gap:5px}
.steck label b{font-family:var(--f-display);font-size:1.08rem;text-transform:uppercase;letter-spacing:.04em}
.who{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.out{white-space:pre-wrap}
.src-list{font-size:13.5px;color:var(--ink-2);display:grid;gap:3px;padding-left:18px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;z-index:30;max-width:calc(100% - 32px);font-size:14px}
@media (max-width:480px){.panel{padding:14px 12px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" hidden></div>

function linreg(pts){const n=pts.length;if(n<2)return null;let sx=0,sy=0,sxx=0,sxy=0;for(const [x,y] of pts){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}const den=n*sxx-sx*sx;if(Math.abs(den)<1e-9)return null;const b=(n*sxy-sx*sy)/den;return {b,a:(sy-b*sx)/n};}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

// ---------------- Speichern ----------------
const queue={};
function put(path,obj){
  if(ui.mode!=='online'||!db) return;
  const e=queue[path]||(queue[path]={busy:false,next:null});
  e.next=obj; if(!e.busy) flush(path);
}
async function flush(path){
  const e=queue[path]; e.busy=true;
  while(e.next){
    const o=e.next; e.next=null;
    try{ await db.doc(path).set(o); }
    catch(err){
      if(err&&err.code==='unavailable'){ await sleep(600+Math.random()*700); try{ await db.doc(path).set(o); continue; }catch(e2){} }
      toast(err&&err.code==='revoked'?'Kein Zugriff mehr auf diese Sitzung.':'Speichern hat nicht geklappt. Bitte erneut versuchen.');
    }
  }
  e.busy=false;
}
let teamTimer=null;
function saveTeam(now){
  dirtyOwn=true;
  clearTimeout(teamTimer);
  const go=()=>{ if(ui.role==='berg'||ui.role==='meer') put(`games/${ui.code}/teams/${ui.role}`,JSON.parse(JSON.stringify(team(ui.role)))); };

}
const jointTimers={};
const jointPending={};
function saveJoint(k,v,now){
  drafts[k]=v; jointPending[k]=true;
  clearTimeout(jointTimers[k]);
  const go=()=>{ jointPending[k]=false;
    if(ui.mode!=='online'){ data.joint[k]={v,by:ui.role,t:Date.now()}; delete drafts[k]; return; }
    put(`games/${ui.code}/joint/${k}`,{v,by:ui.role||'',t:Date.now()});
  };
  if(now) go(); else jointTimers[k]=setTimeout(go,700);
}

function newCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function stopSubs(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];}
function docsOf(snap){ if(!snap) return []; if(Array.isArray(snap.docs)) return snap.docs; const out=[]; if(snap.forEach) snap.forEach(d=>out.push(d)); return out; }
function docId(d){ return d.id || (d.ref&&d.ref.id) || ''; }
let staleTimer=null;
function subscribe(code){
  stopSubs(); ui.staleNote=false; clearTimeout(staleTimer);
  staleTimer=setTimeout(()=>{ui.staleNote=true;render();},10000);
  unsubs.push(db.doc('games/'+code).onSnapshot(snap=>{
    clearTimeout(staleTimer); ui.staleNote=false;
    if(!snap.exists && !(snap.metadata&&snap.metadata.fromCache)){ ui.joinError='Zu diesem Code gibt es keine Sitzung.'; leave(true); return; }
    ui.loaded=true; render();
  },()=>{clearTimeout(staleTimer);toast('Verbindung verloren. Seite neu öffnen.');}));
  unsubs.push(db.collection(`games/${code}/teams`).onSnapshot(snap=>{
    for(const d of docsOf(snap)){
      const id=docId(d); if(id!=='berg'&&id!=='meer') continue;
      if(id===ui.role && dirtyOwn) continue; // eigene, lokal bearbeitete Daten nicht überschreiben
      const v=d.data()||{}; data.teams[id]={ans:v.ans||{},done:v.done||{},meas:v.meas||{}};
    }
    render();
  },()=>{}));
  unsubs.push(db.collection(`games/${code}/joint`).onSnapshot(snap=>{
    for(const d of docsOf(snap)){
      const id=docId(d); const v=d.data()||{}; data.joint[id]=v;
      const focused=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k===id;
      if(id in drafts && !jointPending[id] && (drafts[id]===v.v || !focused)) delete drafts[id];
    }
    render();
  },()=>{}));
}
async function createGame(){
  if(!db){toast('Zwei-Tablet-Modus ist hier nicht verfügbar.');return;}
  const code=newCode();
  try{ await db.doc('games/'+code).set({v:1,app:'fieberthermometer',createdAt:Date.now()}); }
  catch(e){ toast(e&&e.code==='quota_exceeded'?'Speicher voll: alte Sitzungen müssen gelöscht werden.':'Sitzung konnte nicht angelegt werden.'); return; }
  enter(code,'online');
}
function joinGame(raw){
  const code=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);

function enter(code,mode){

function leave(keepErr){

  if(window.morphdom){
    window.morphdom(app,'<div id="app" class="wrap">'+html+'</div>',{
      onBeforeElUpdated:(from,to)=>{
        if(from===document.activeElement && (from.tagName==='TEXTAREA'||from.tagName==='INPUT')){
          // Feld, in dem gerade getippt oder gezogen wird, nicht anfassen
          if(from.tagName==='INPUT' && from.type!=='range'){ for(const at of ['disabled']) { if(to.hasAttribute(at)) from.setAttribute(at,''); else from.removeAttribute(at);} }
          return false;
        }
        if(from.tagName==='TEXTAREA' && from.value!==to.value) from.value=to.value;
        return true;
      }
    });
    keep=null;
  } else app.innerHTML=html;
  document.body.dataset.zone = (ui.screen==='app' && ['m','syn','end'].includes(ui.tab)) ? 'joint' : '';

function measFor(id){ return (team('berg').meas[id])||[]; }
function catchButterfly(spId,siteId){
  const sp=SPEC.find(s=>s.id===spId), site=SITES.find(s=>s.id===siteId);
  if(!sp.sites.includes(siteId)){ toast(`${sp.name}: auf der ${site.t} nicht gefunden. Versucht eine andere Höhe.`); return; }
  const base=25.5-(site.h-820)/100*LAPSE;
  const ta_=clamp(base+(Math.random()*10-5),11.5,29.8);
  const tb=29+(1-sp.buf)*(ta_-20)+gauss()*0.45;
  const m=team('berg').meas; (m[spId]=m[spId]||[]).push([Math.round(ta_*10)/10,Math.round(tb*10)/10,siteId]);
  saveTeam(); render();
}
function spFit(id){ const p=measFor(id).map(x=>[x[0],x[1]]); if(p.length<MIN_PTS) return null; const sites=new Set(measFor(id).map(x=>x[2])); if(sites.size<2) return null; return linreg(p); }
function scatterB(id){
  const pts=measFor(id), f=spFit(id);
  const W=520,H=300,L=42,R=12,T=12,B=36, x0=10,x1=32,y0=16,y1=42;
  const xs=x=>L+(W-L-R)*(x-x0)/(x1-x0), ys=y=>T+(H-T-B)*(1-(y-y0)/(y1-y0));
  let g='';
  for(let x=10;x<=32;x+=4) g+=`<line class="ax" x1="${xs(x)}" x2="${xs(x)}" y1="${T}" y2="${H-B}"/><text x="${xs(x)}" y="${H-B+16}" text-anchor="middle">${x}</text>`;
  for(let y=16;y<=42;y+=4) g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${ys(y)}" y2="${ys(y)}"/><text x="${L-6}" y="${ys(y)+4}" text-anchor="end">${y}</text>`;
  g+=`<line x1="${xs(16)}" y1="${ys(16)}" x2="${xs(32)}" y2="${ys(32)}" stroke="var(--muted)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${xs(31)}" y="${ys(31)+16}" text-anchor="end">Körper = Luft</text>`;
  const colSite={tal:'var(--good)',mitte:'var(--warn)',hoch:'var(--cold)'};
  for(const [a,b,s] of pts) g+=`<circle cx="${xs(a)}" cy="${ys(b)}" r="4.5" fill="${colSite[s]}" fill-opacity=".85"/>`;
  if(f) g+=`<line x1="${xs(11)}" y1="${ys(f.a+f.b*11)}" x2="${xs(30)}" y2="${ys(f.a+f.b*30)}" stroke="var(--berg)" stroke-width="3"/>`;
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">Lufttemperatur (°C)</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">Körpertemperatur (°C)</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Körpertemperatur gegen Lufttemperatur">${g}</svg>
  <div class="legend"><span><span class="sw" style="background:var(--good)"></span>820 m</span><span><span class="sw" style="background:var(--warn)"></span>1320 m</span><span><span class="sw" style="background:var(--cold)"></span>1825 m</span><span><span class="sw" style="background:var(--berg)"></span>Ausgleichsgerade</span></div></div>`;
}
function scatterShift(){
  const W=520,H=280,L=46,R=14,T=14,B=38, x0=0,x1=0.6,y0=0,y1=220;
  const xs=x=>L+(W-L-R)*(x-x0)/(x1-x0), ys=y=>T+(H-T-B)*(1-(y-y0)/(y1-y0));
  let g='';
  for(let x=0;x<=0.6001;x+=0.1) g+=`<line class="ax" x1="${xs(x)}" x2="${xs(x)}" y1="${T}" y2="${H-B}"/><text x="${xs(x)}" y="${H-B+16}" text-anchor="middle">${fmt(x,1)}</text>`;
  for(let y=0;y<=220;y+=50) g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${ys(y)}" y2="${ys(y)}"/><text x="${L-6}" y="${ys(y)+4}" text-anchor="end">${y}</text>`;
  const pts=SPEC.map(s=>{const f=spFit(s.id);return f?[1-f.b,s.shift,s]:null;}).filter(Boolean);
  const lr=linreg(pts.map(p=>[p[0],p[1]]));
  if(lr&&pts.length>=3) g+=`<line x1="${xs(0)}" y1="${ys(lr.a)}" x2="${xs(0.6)}" y2="${ys(clamp(lr.a+lr.b*0.6,0,220))}" stroke="var(--berg)" stroke-width="2.5" stroke-dasharray="6 4"/>`;
  for(const [x,y,s] of pts){ g+=`<circle cx="${xs(clamp(x,0,0.6))}" cy="${ys(y)}" r="7" fill="${s.wing}" stroke="var(--ink)" stroke-width="1.5"/><text class="lbl" x="${xs(clamp(x,0,0.6))+10}" y="${ys(y)+4}">${s.real?s.lat:s.name}</text>`; }
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">Puffer (Thermoregulation) = 1 − Steigung</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">Höhenverschiebung in 10 Jahren (m)</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puffer gegen Höhenverschiebung">${g}</svg></div>`;
}

function bandArea(lo,hi){ lo=clamp(lo,600,2700); hi=clamp(hi,600,2700); if(hi<=lo) return 0; const F=h=>-((2700-h)**2)/2; return F(hi)-F(lo); }
function viewB3(){

  const W=520,H=320,L=48,R=14,T=12,B=26, ys=h=>T+(H-T-B)*(1-(h-600)/2100), cx=(L+W-R)/2, half=(W-L-R)/2;
  const xl=h=>cx-half*(2700-h)/2100, xr=h=>cx+half*(2700-h)/2100;
  let g=`<defs><clipPath id="mtn"><polygon points="${xl(600)},${ys(600)} ${cx},${ys(2700)} ${xr(600)},${ys(600)}"/></clipPath>
   <pattern id="forest" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M5 1 L9 9 L1 9 Z" fill="var(--good)" fill-opacity=".55"/></pattern></defs>`;
  for(let h=600;h<=2700;h+=300) g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${ys(h)}" y2="${ys(h)}"/><text x="${L-6}" y="${ys(h)+4}" text-anchor="end">${h}</text>`;
  g+=`<polygon points="${xl(600)},${ys(600)} ${cx},${ys(2700)} ${xr(600)},${ys(600)}" fill="var(--surface-2)" stroke="var(--muted)" stroke-width="1.5"/>`;
  g+=`<g clip-path="url(#mtn)">`;
  if(s.barrier) g+=`<rect x="${L}" y="${ys(1650)}" width="${W-L-R}" height="${ys(1250)-ys(1650)}" fill="url(#forest)"/>`;
  for(const b of bands){ g+=`<rect x="${L}" y="${ys(b.hi+real)}" width="${W-L-R}" height="${Math.max(0,ys(b.lo+real)-ys(b.hi+real))}" fill="${b.c}" fill-opacity=".85"/>`; }
  g+=`</g>`;
  for(const b of bands){ g+=`<rect x="${xl(b.lo)-2}" y="${ys(b.hi)}" width="${xr(b.lo)-xl(b.lo)+4}" height="${ys(b.lo)-ys(b.hi)}" fill="none" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1" opacity=".5"/>`; }
  g+=`<text x="${W-R}" y="${ys(2700)+12}" text-anchor="end">Gipfel 2700 m</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">Höhe (m)</text>`;
  const rows=bands.map(b=>{const a0=bandArea(b.lo,b.hi),a1=bandArea(b.lo+real,b.hi+real);return `<tr><td><span class="sw" style="background:${b.c};border:1px solid var(--line)"></span>${b.n}</td><td class="n">${b.lo}–${b.hi} m</td><td class="n">${Math.round(b.lo+real)}–${Math.round(Math.min(b.hi+real,2700))} m</td><td class="n">${Math.round(a1/a0*100)} %</td></tr>`;}).join('');

  return stepHead(3,'Ausweichen, anpassen oder aussterben?','Auf Erwärmung können Arten auf drei Arten reagieren: Sie passen sich vor Ort an, sie wandern in passende Gebiete aus, oder sie sterben lokal aus. Die Simulation zeigt, was das Ausweichen am Berg bedeutet.')+

      <div class="legend"><span>gestrichelt: heutiger Lebensraum</span><span>farbig: nach der Erwärmung</span>${s.barrier?'<span><span class="sw" style="background:var(--good);opacity:.55"></span>Wald</span>':''}</div>

function vRow(k,label){

  return ['Zunahme','st-up'];
}

function viewSyn(){
  if(!bothDone('m')) return `<div class="panel stack"><h2>Noch gesperrt</h2><p>Die Vertiefung öffnet sich, wenn beide Teams ihre Spalte der Mustertabelle abgegeben haben.</p></div>`;
  const reveal=!!J('syn_reveal');
  let lastG='';
  const cards=SYN.map(s=>{
    const head = s.g!==lastG ? `<div class="grouph" style="grid-column:1/-1">${s.g}</div>`:''; lastG=s.g;
    const hl = reveal && ['schornstein','raubbau','landflucht'].includes(s.id);
    return head+`<div class="sync ${hl?'hl':''}"><b>${s.n}</b><span class="small muted">${s.d}</span>${seg('syn_'+s.id,SYNOPT,true)}</div>`;
  }).join('');
  const marked=SYN.filter(s=>J('syn_'+s.id)).length;
  return stepHead(6,'Ein neues Syndrom des globalen Wandels?',`Der Wissenschaftliche Beirat der Bundesregierung Globale Umweltveränderungen (WBGU) hat 1996 16 typische Muster beschrieben, in denen Mensch und Umwelt sich gegenseitig schädigen: die <b>Syndrome des globalen Wandels</b>. Sie sind wie Krankheitsbilder aufgebaut: mit Leitsymptom, Symptomen und einem Beziehungsgeflecht, das in vielen Räumen der Erde gleich funktioniert. Beide Tablets bearbeiten dieselben Felder.`,'Vertiefung · gemeinsam')+`
  <section class="stack">
    <div class="ph"><span class="stepno">6a</span><h2>Passt eines der 16 Syndrome?</h2></div>
    <p class="muted">Ordnet jedes Syndrom ein: Ist es eine <b>Ursache</b> des Musters, eine <b>Kopplung</b> (verstärkt es zusätzlich) oder <b>passt es nicht</b>?</p>
    <div class="syn">${cards}</div>
    <div class="task"><b>Aufgabe · Fazit<span class="afb">AFB III</span></b><p><span class="op">Prüft</span>: Beschreibt eines der 16 Syndrome das Muster aus der Mustertabelle selbst? Begründet.</p>${jta('syn_fazit','')}</div>
    ${reveal?`<div class="check stack"><b>Abgleich: Fachliche Einordnung</b>
      <p><b>Keines der 16 Syndrome beschreibt das Muster selbst.</b> Die Syndrome sind nach menschlichen Ursachen geordnet (Nutzung, Entwicklung, Senken). Die Umverteilung der Arten ist dort nur eine Folge unter vielen.</p>
      <p><b>Ursache:</b> Das <b>Hoher-Schornstein-Syndrom</b> beschreibt die weiträumige Verteilung langlebiger Stoffe wie Treibhausgase. Es ist die gemeinsame Ursache der Erwärmung in Alpen und Nordatlantik, mit Fernwirkung weit weg von den Quellen.</p>
      <p><b>Kopplung:</b> Beim Kabeljau das <b>Raubbau-Syndrom</b> (Überfischung). Bei den Faltern kommt das <b>Landflucht-Syndrom</b> in Frage: Werden Almen nicht mehr beweidet, wachsen sie zu Wald zu, und die Barrieren zwischen den Bergwiesen werden größer. Diskutabel ist auch das Massentourismus-Syndrom im Hochgebirge.</p>
      <p><b>Folgerung:</b> Das Muster „Arten folgen ihrem Temperaturfenster“ ist bisher kein eigenes Syndrom. In der Forschung gibt es Begriffe für Teile davon: Umverteilung der Arten (<i>species redistribution</i>), Rolltreppe ins Aussterben (<i>escalator to extinction</i>), Thermophilisierung. Ihr könnt es nun selbst als Syndrom beschreiben.</p></div>`
     :`<div class="row"><button class="btn ghost" data-a="jset" data-k="syn_reveal" data-v="1" ${marked>=10&&J('syn_fazit').trim().length>15?'':'disabled'}>Fachliche Einordnung anzeigen</button><span class="muted small">${marked}/16 eingeordnet${marked>=10?'':' (mind. 10)'}, Fazit nötig</span></div>`}
  </section>
  ${reveal?`<section class="stack steck" style="margin-top:26px">
    <div class="ph"><span class="stepno">6b</span><h2>Euer Syndrom-Steckbrief</h2></div>
    <p class="muted" style="max-width:78ch">Beschreibt das Muster nach dem Vorbild des WBGU. Wichtig: Ein Syndrom beschreibt immer ein Zusammenspiel von Mensch und Natur. Klärt, wo der Mensch im Beziehungsgeflecht vorkommt.</p>
    <div class="grid2">${STECK.map(f=>`<label class="f"><b>${f.t}</b><span class="muted small">${f.q}</span>${jta(f.k,'',f.short?'short':'')}</label>`).join('')}</div>
    <div><button class="btn accent" data-a="tab" data-tab="end">Zum Ergebnis →</button></div>
  </section>`:''}`;
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(['range','sim','simchk'].includes(a)) return;
  if(a==='create') createGame();
  else if(a==='rejoin') joinGame(b.dataset.code);
  else if(a==='local') enter('LOKAL','local');
  else if(a==='leave') leave();
  else if(a==='role') takeRole(b.dataset.role);
  else if(a==='switchrole'){ ui.screen='role'; ui.role=null; document.body.dataset.role=''; render(); }
  else if(a==='localrole'){ ui.role=b.dataset.role; document.body.dataset.role=ui.role; if(['s1','s2','s3','s4'].includes(ui.tab)) ui.tab=firstOpenTab(ui.role); render(); window.scrollTo(0,0); }
  else if(a==='tab'){ ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); }
  else if(a==='obsview'){ ui.tab=b.dataset.v; render(); window.scrollTo(0,0); }
  else if(a==='pick'){ setAns(b.dataset.k,b.dataset.v,true); render(); }
  else if(a==='jpick'){ const cur=J(b.dataset.k); saveJoint(b.dataset.k, cur===b.dataset.v?'':b.dataset.v, true); render(); }
  else if(a==='jset'){ saveJoint(b.dataset.k,b.dataset.v,true); render(); }
  else if(a==='done'){ setDone(b.dataset.s,true); render(); }
  else if(a==='undone'){ setDone(b.dataset.s,false); render(); }
  else if(a==='b2sp'){ ui.b2sp=b.dataset.id; render(); }
  else if(a==='catch') catchButterfly(ui.b2sp,b.dataset.site);
  else if(a==='clearsp'){ team('berg').meas[ui.b2sp]=[]; saveTeam(true); render(); }
  else if(a==='probe'){ const m=team('meer').meas; m.probe=[...(m.probe||[]),b.dataset.id]; saveTeam(true); render(); }
  else if(a==='submitcol'){ setDone('m',true); render(); }
  else if(a==='unsubmit'){ setDone('m',false); render(); }
  else if(a==='copy'){ try{ await navigator.clipboard.writeText(resultText()); toast('Ergebnis kopiert.'); }catch(err){ toast('Kopieren wurde vom Browser blockiert.'); } }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.a==='range'){ setAns(el.dataset.k,el.value); render(); return; }
  if(el.dataset.a==='sim'){ ui.sim[el.dataset.k]=+el.value; render(); return; }
  if(el.dataset.t==='team'){ setAns(el.dataset.k,el.value); maybeRefreshButtons(); return; }
  if(el.dataset.t==='joint'){ saveJoint(el.dataset.k,el.value); maybeRefreshButtons(); return; }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a==='simchk'){ ui.sim[el.dataset.k]=el.checked; render(); }
});
document.addEventListener('focusout',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.t==='joint') saveJoint(el.dataset.k,el.value,true);
  if(el.dataset&&el.dataset.t==='team') saveTeam(true);
});
document.addEventListener('submit',e=>{ if(e.target.dataset.form==='join'){ e.preventDefault(); joinGame($('#joincode').value); } });
// Freigabe-Knöpfe aktualisieren, ohne beim Tippen neu zu zeichnen
let refreshTimer=null;
function maybeRefreshButtons(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(()=>render(),900); }

// ===================== Start =====================
render();
(async()=>{
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++) await sleep(100);
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  ui.dbState = db ? 'on' : 'off';
  if(ui.screen==='lobby') render();
})();
setTimeout(()=>{ if(ui.dbState==='loading'){ ui.dbState='off'; if(ui.screen==='lobby') render(); } },11000);
</script>
